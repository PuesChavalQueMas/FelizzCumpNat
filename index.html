<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Feliz Cumpleaños, Nataly! ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --rosa: #ff4da6;
            --dorado: #ffd700;
            --lila: #c026d3;
            --transition: all 0.8s cubic-bezier(0.23, 1, 0.32, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            min-height: 100%;
            overflow-x: hidden;
            overflow-y: auto;
            background: linear-gradient(135deg, #1a0033 0%, #4a0072 100%);
            font-family: 'Inter', sans-serif;
            color: white;
        }

        .background {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://i.pinimg.com/736x/c4/b8/8f/c4b88f8ec4620f2c4d1cd9d622850268.jpg') top/cover no-repeat;
            filter: brightness(0.45) blur(3px);
            z-index: 1;
        }

        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(transparent, rgba(74, 0, 114, 0.75));
            z-index: 2;
        }

        .content {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: clamp(80px, 10vw, 100px) clamp(16px, 5vw, 60px) clamp(40px, 8vw, 80px);
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.4rem, 7vw, 6rem);
            line-height: 1.05;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #ff4da6, #ffd700, #e879f9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: glow 3s ease-in-out infinite alternate;
            word-break: break-word;
        }

        @keyframes glow {
            from { filter: brightness(1) hue-rotate(0deg); }
            to { filter: brightness(1.35) hue-rotate(8deg); }
        }

        .subtitle {
            font-size: clamp(1.3rem, 4vw, 2.5rem);
            margin-bottom: 20px;
            color: #ffd700;
            font-weight: 700;
            letter-spacing: 3px;
        }

        .cake {
            font-size: clamp(4rem, 10vw, 7rem);
            margin: 12px 0 20px;
            animation: bounce 2.2s infinite ease-in-out;
            filter: drop-shadow(0 10px 20px rgba(255, 215, 0, 0.7));
            display: block;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .message {
            width: 100%;
            max-width: 640px;
            font-size: clamp(1rem, 2.8vw, 1.3rem);
            line-height: 1.7;
            margin: 20px auto;
            padding: clamp(20px, 4vw, 32px) clamp(18px, 4vw, 28px);
            background: rgba(255,255,255,0.09);
            backdrop-filter: blur(25px);
            border-radius: 28px;
            border: 1px solid rgba(255, 77, 166, 0.25);
        }

        .message p + p {
            margin-top: 12px;
        }

        .profile-card {
            margin-top: 30px;
            width: min(360px, 90vw);
            padding: clamp(20px, 4vw, 28px) clamp(16px, 4vw, 22px);
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(28px);
            border-radius: 32px;
            border: 2px solid rgba(255, 77, 166, 0.4);
            transition: var(--transition);
            cursor: pointer;
            opacity: 0;
            transform: translateY(50px);
        }

        .profile-card.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .pfp {
            width: clamp(100px, 25vw, 130px);
            height: clamp(100px, 25vw, 130px);
            border-radius: 50%;
            border: 6px solid #ffd700;
            object-fit: cover;
            margin: 0 auto 18px;
            display: block;
        }

        .name {
            font-size: clamp(1.8rem, 5vw, 2.4rem);
            font-weight: 800;
            color: white;
            margin-bottom: 6px;
        }

        .heart { color: #ff4da6; }

        .btn-back {
            position: fixed;
            top: 18px;
            left: 18px;
            padding: 10px 22px;
            background: rgba(0,0,0,0.45);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 50px;
            color: white;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            z-index: 100;
            transition: var(--transition);
        }

        .btn-back:hover {
            background: rgba(255,77,166,0.6);
            transform: scale(1.05);
        }

        .confetti {
            position: fixed;
            top: -15px;
            width: 12px;
            height: 12px;
            border-radius: 3px;
            animation: fall linear forwards;
            z-index: 5;
            pointer-events: none;
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(800deg);
                opacity: 0;
            }
        }

        .hint {
            margin-top: 28px;
            font-size: clamp(0.8rem, 2.5vw, 0.95rem);
            color: rgba(255,255,255,0.65);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="background"></div>
    <div class="overlay"></div>

    <button class="btn-back" onclick="cerrarTodo()">← Cerrar</button>

    <div class="content">
        <span class="cake">🎂</span>

        <h1 class="title">¡FELIZ CUMPLEAÑOS</h1>
        <h2 class="subtitle">NATALY ✨</h2>

        <div class="message">
            <p>¡Feliz cumple, Nat! xd Espero que estés bien y feliz. Tanto tiempo sin hablar, pero qué bueno que andes bien...</p>
            <p>Me imagino que matándote con las tareas y las clases como siempre aeaa, ¡dale con todo! xd</p>
        </div>

        <div onclick="abrirTarjeta(this)" class="profile-card" id="tarjeta">
            <img src="img/K Pop Wallpaper.jpg"
                 class="pfp" alt="Nataly">
            <div>
                <p class="name">Nataly <span class="heart">❤️</span></p>
                <p style="color:#ffd700; font-weight:700; font-size:1.1rem;">La reinaa</p>
            </div>
        </div>

        <p class="hint">Toca la tarjeta para verla brillar</p>
    </div>

    <script>
        function crearConfeti() {
            const colors = ['#ff4da6','#ffd700','#e879f9','#a78bfa','#67e8f9','#ffffff'];
            for (let i = 0; i < 120; i++) {
                const c = document.createElement('div');
                c.classList.add('confetti');
                c.style.left = Math.random() * 100 + 'vw';
                c.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                const s = Math.random() * 13 + 8 + 'px';
                c.style.width = s; c.style.height = s;
                c.style.animationDuration = Math.random() * 4 + 4 + 's';
                c.style.animationDelay = Math.random() * 2 + 's';
                c.style.opacity = Math.random() * 0.5 + 0.6;
                document.body.appendChild(c);
                setTimeout(() => c.remove(), 9000);
            }
        }

        function abrirTarjeta(el) {
            el.classList.add('visible');
            crearConfeti();
            setTimeout(crearConfeti, 300);
            setTimeout(crearConfeti, 700);
        }

        function cerrarTodo() {
            document.getElementById('tarjeta').classList.remove('visible');
        }

        window.onload = () => {
            crearConfeti();
            setInterval(() => { if (Math.random() > 0.5) crearConfeti(); }, 1800);
        };
    </script>
</body>
</html>
